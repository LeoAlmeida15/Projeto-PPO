<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Receitas Fáceis e Econômicas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <a class="logo" href="index.html">Receitas <span>Fáceis</span></a>
  <nav>
    <a href="index.html">Início</a><a href="receitas.html">Receitas</a>
    <a href="categorias.html">Categorias</a><a href="contato.html">Contato</a>
    <a href="login.html" id="loginLink">Entrar</a><button class="link-button hidden" id="logoutBtn">Sair</button>
  </nav>
</header>
<main class="container page narrow">
  <p class="eyebrow">Fale conosco</p><h1>Contato</h1>
  <p>Envie sua mensagem, dúvida ou sugestão.</p>
  <form id="contatoForm" class="form-card">
    <label>Nome<input id="nome" required maxlength="100"></label>
    <label>E-mail<input id="email" type="email" required></label>
    <label>Mensagem<textarea id="mensagem" required rows="6"></textarea></label>
    <button class="btn" type="submit">Enviar mensagem</button>
    <p id="mensagemStatus" class="status"></p>
  </form>
</main>
<footer>Receitas Fáceis e Econômicas © 2026</footer>
<script src="js/api.js"></script><script src="js/app.js"></script><script src="js/contato.js"></script>
</body>
</html>
