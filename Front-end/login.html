<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Receitas Fáceis e Econômicas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <a class="logo" href="index.html">Receitas <span>Fáceis</span></a>
  <nav><a href="index.html">Início</a><a href="receitas.html">Receitas</a><a href="categorias.html">Categorias</a><a href="contato.html">Contato</a></nav>
</header>
<main class="container page narrow">
  <div class="auth-switch">
    <button id="mostrarLogin" class="active">Entrar</button>
    <button id="mostrarCadastro">Criar conta</button>
  </div>

  <form id="loginForm" class="form-card">
    <h1>Entrar</h1>
    <label>E-mail<input id="loginEmail" type="email" required></label>
    <label>Senha<input id="loginSenha" type="password" required></label>
    <button class="btn" type="submit">Entrar</button>
    <p id="loginStatus" class="status"></p>
  </form>

  <form id="cadastroForm" class="form-card hidden">
    <h1>Criar conta</h1>
    <label>Nome<input id="cadNome" required maxlength="100"></label>
    <label>E-mail<input id="cadEmail" type="email" required></label>
    <label>Senha<input id="cadSenha" type="password" minlength="6" required></label>
    <button class="btn" type="submit">Cadastrar</button>
    <p id="cadStatus" class="status"></p>
  </form>
</main>
<footer>Receitas Fáceis e Econômicas © 2026</footer>
<script src="js/api.js"></script><script src="js/app.js"></script><script src="js/login.js"></script>
</body>
</html>
